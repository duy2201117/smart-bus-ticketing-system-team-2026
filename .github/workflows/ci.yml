name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test CancelModal
        if: always()
        run: npx vitest run src/components/CancelModal.test.jsx

      - name: Test ChangeTripModal
        if: always()
        run: npx vitest run src/components/ChangeTripModal.test.jsx

      - name: Test CountdownTimer
        if: always()
        run: npx vitest run src/components/CountdownTimer.test.jsx

      - name: Test SelectSeat
        if: always()
        run: npx vitest run src/pages/SelectSeat.test.jsx

      - name: Test ticketService
        if: always()
        run: npx vitest run src/services/ticketService.test.js

      - name: Server tests
        if: always()
        run: npm run test:server

      - name: Production build
        if: always()
        run: npm run build
